<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega.nz Downloader Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Mega.nz Downloader Web</h1>
        <p class="subtitle">Extractor de metadatos de enlaces públicos</p>

        <div class="input-group">
            <input 
                type="text" 
                id="megaUrl" 
                placeholder="Pegá tu enlace de MEGA (ej. https://mega.nz/file/...)"
                autocomplete="off"
            >
            <button id="downloadBtn">Obtener metadatos</button>
        </div>

        <pre id="resultado">Esperando enlace...</pre>
    </main>

    <script src="script.js"></script>
</body>
</html>
